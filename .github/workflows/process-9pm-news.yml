name: Process 9 PM News

on:
  schedule:
    # Run at 9:00 AM IST (3:30 UTC) every day
    # IST is UTC+5:30, so 9:00 AM IST = 3:30 UTC
    - cron: '30 3 * * *'
  
  workflow_dispatch:
    # Allow manual triggering from GitHub UI
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD format, leave empty for today)'
        required: false
        type: string
      force:
        description: 'Force processing (bypass cache)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  process-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the dev branch
          ref: dev
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Process 9 PM news
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          else
            # Use current IST date for 9 PM news (same day evening)
            IST_DATE=$(date -u +"%Y-%m-%d" -d "now +330 minutes")
            DATE_ARG="--date $IST_DATE"
          fi
          
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          else
            FORCE_ARG=""
          fi
          
          python -m scripts.process_daily_news --slot 9pm $DATE_ARG $FORCE_ARG
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "chore: update 9 PM news data - $(date -u +%Y-%m-%d)"
          git push
      
      - name: Upload workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs-9pm-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7
          if-no-files-found: ignore
