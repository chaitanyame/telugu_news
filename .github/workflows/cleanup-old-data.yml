name: Weekly Data Cleanup

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  
  workflow_dispatch:
    # Allow manual triggering from GitHub UI
    inputs:
      days_to_keep:
        description: 'Number of days to keep (default: 30)'
        required: false
        type: number
        default: 30
      dry_run:
        description: 'Dry run mode (no actual deletion)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the dev branch
          ref: dev
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Run cleanup script
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          else
            DRY_RUN_FLAG=""
          fi
          
          if [ -n "${{ github.event.inputs.days_to_keep }}" ]; then
            DAYS_ARG="--days ${{ github.event.inputs.days_to_keep }}"
          else
            DAYS_ARG=""
          fi
          
          python -m scripts.cleanup $DAYS_ARG $DRY_RUN_FLAG
      
      - name: Regenerate index.json
        if: github.event.inputs.dry_run != 'true'
        run: |
          python -c "from scripts.json_generator import generate_index; generate_index()"
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "chore: cleanup old data files - $(date -u +%Y-%m-%d)"
          git push
      
      - name: Upload cleanup summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-summary-${{ github.run_number }}
          path: |
            cleanup-*.log
          retention-days: 30
          if-no-files-found: ignore
