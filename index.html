<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="తెలుగు వార్తలు - రోజువారీ సాయంత్రం మరియు ఉదయం వార్తల సారాంశం">
    <title>తెలుగు వార్తలు | Telugu News Aggregator</title>
    
    <!-- Google Fonts for Telugu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">కంటెంట్‌కు వెళ్లండి</a>
    
    <header aria-label="సైట్ నావిగేషన్">
        <div class="header-container">
            <h1 class="site-title">తెలుగు వార్తలు</h1>
            <p class="site-subtitle">రోజువారీ వార్తల సారాంశం</p>
        </div>
    </header>

    <main id="main-content" aria-label="ప్రధాన కంటెంట్">
        <aside class="sidebar" aria-label="ఫిల్టర్ ఎంపికలు">
            <section class="filter-section">
                <h2>ఫిల్టర్లు</h2>
                
                <div class="filter-group">
                    <h3>సమయం</h3>
                    <label>
                        <input type="checkbox" name="slot" value="9pm" checked>
                        <span>సాయంత్రం వార్తలు</span>
                    </label>
                    <label>
                        <input type="checkbox" name="slot" value="7am" checked>
                        <span>ఉదయం వార్తలు</span>
                    </label>
                </div>

                <div class="filter-group">
                    <h3>తేదీ పరిధి</h3>
                    <label for="date-from">నుండి:</label>
                    <input type="date" id="date-from" name="date-from">
                    
                    <label for="date-to">వరకు:</label>
                    <input type="date" id="date-to" name="date-to">
                </div>

                <button class="apply-filters-btn">ఫిల్టర్లు వర్తించండి</button>
            </section>
        </aside>

        <article class="content">
            <section class="news-header">
                <h2>తాజా వార్తలు</h2>
            </section>

            <section class="news-list" id="news-list" role="feed" aria-label="వార్తల జాబితా">
                <div class="loading" role="status" aria-live="polite">
                    <p>వార్తలు లోడ్ అవుతున్నాయి...</p>
                </div>
            </section>

            <section class="pagination">
                <button class="pagination-btn" id="prev-btn" aria-label="మునుపటి పేజీకి వెళ్లండి" disabled>← మునుపటిది</button>
                <span class="page-info" id="page-info" aria-live="polite">పేజీ 1</span>
                <button class="pagination-btn" id="next-btn" aria-label="తర్వాతి పేజీకి వెళ్లండి" disabled>తర్వాతది →</button>
            </section>
        </article>
    </main>

    <footer aria-label="సైట్ సమాచారం">
        <div class="footer-container">
            <p class="footer-text">
                తెలుగు వార్తలు © <span id="current-year"></span>
            </p>
            <p class="footer-updated">
                చివరిగా నవీకరించబడింది: <time id="last-updated" datetime="">--</time>
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/utils/data-loader.js"></script>
    <script src="js/main.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sw-register.js"></script>
</body>
</html>
