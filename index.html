<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="తెలుగు వార్తలు - రోజువారీ సాయంత్రం మరియు ఉదయం వార్తల సారాంశం">
    <title>తెలుగు వార్తలు | Telugu News Aggregator</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Fonts for Telugu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">కంటెంట్‌కు వెళ్లండి</a>
    
    <header aria-label="సైట్ నావిగేషన్">
        <div class="header-container">
            <div class="header-top">
                <h1 class="site-title">తెలుగు వార్తలు</h1>
                <div class="header-controls">
                    <!-- Dark Mode Toggle -->
                    <button class="theme-toggle" id="theme-toggle" aria-label="థీమ్ మార్చండి" title="డార్క్/లైట్ మోడ్">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="site-subtitle">రోజువారీ వార్తల సారాంశం</p>
        </div>
    </header>

    <main id="main-content" aria-label="ప్రధాన కంటెంట్">
        <aside class="sidebar" aria-label="తేదీ ఎంపికలు">
            <section class="dates-section">
                <div class="dates-header">
                    <h2>తేదీలు</h2>
                    <div class="view-mode-selector">
                        <button class="sidebar-view-btn active" data-sidebar-view="month" title="నెల వారీగా">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </button>
                        <button class="sidebar-view-btn" data-sidebar-view="list" title="జాబితాగా">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="dates-list" id="dates-list" role="navigation" aria-label="వార్తల తేదీలు">
                    <div class="loading-dates">లోడ్ అవుతోంది...</div>
                </div>
            </section>
        </aside>

        <article class="content">
            <section class="news-header">
                <h2>తాజా వార్తలు</h2>
            </section>

            <section class="news-list" id="news-list" role="feed" aria-label="వార్తల జాబితా">
                <div class="loading" role="status" aria-live="polite">
                    <p>వార్తలు లోడ్ అవుతున్నాయి...</p>
                </div>
            </section>

            <!-- Load More Button (hybrid pagination) -->
            <div class="load-more-container" id="load-more-container" style="display: none;">
                <button class="load-more-btn" id="load-more-btn" aria-label="మరిన్ని వార్తలు లోడ్ చేయండి">
                    మరిన్ని వార్తలు లోడ్ చేయండి
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <p class="load-more-info" id="load-more-info"></p>
            </div>

            <section class="pagination">
                <button class="pagination-btn" id="prev-btn" aria-label="మునుపటి పేజీకి వెళ్లండి" disabled>← మునుపటిది</button>
                <span class="page-info" id="page-info" aria-live="polite">పేజీ 1</span>
                <button class="pagination-btn" id="next-btn" aria-label="తర్వాతి పేజీకి వెళ్లండి" disabled>తర్వాతది →</button>
            </section>
        </article>
    </main>

    <footer aria-label="సైట్ సమాచారం">
        <div class="footer-container">
            <p class="footer-text">
                తెలుగు వార్తలు © <span id="current-year"></span>
            </p>
            <p class="footer-updated">
                చివరిగా నవీకరించబడింది: <time id="last-updated" datetime="">--</time>
            </p>
        </div>
    </footer>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav" id="mobile-nav" aria-label="మొబైల్ నావిగేషన్">
        <button class="mobile-nav-btn" id="mobile-home-btn" data-action="home" aria-label="హోమ్">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>హోమ్</span>
        </button>
        <button class="mobile-nav-btn" id="mobile-dates-btn" data-action="dates" aria-label="తేదీలు">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>తేదీలు</span>
        </button>
        <button class="mobile-nav-btn" id="mobile-prev-btn" data-action="prev" aria-label="మునుపటిది">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>మునుపటి</span>
        </button>
        <button class="mobile-nav-btn" id="mobile-next-btn" data-action="next" aria-label="తర్వాతది">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            <span>తర్వాత</span>
        </button>
    </nav>

    <!-- Mobile Date Picker Modal -->
    <div class="mobile-date-modal" id="mobile-date-modal" aria-hidden="true">
        <div class="modal-overlay" id="modal-overlay"></div>
        <div class="modal-content" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title">తేదీ ఎంచుకోండి</h3>
                <button class="modal-close" id="modal-close" aria-label="మూసివేయండి">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modal-dates-list"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils/data-loader.js"></script>
    <script src="js/main.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sw-register.js"></script>
</body>
</html>
